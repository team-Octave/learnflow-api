<!DOCTYPE html>
<html layout:decorate="~{admin/layout/base}" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org">
<div layout:fragment="content">
    <div class="p-4 bg-white block sm:flex items-center justify-between border-b border-gray-200 lg:mt-1.5 dark:bg-gray-800 dark:border-gray-700">
        <div class="w-full mb-1">
            <div class="mb-4">
                <h1 class="text-xl font-semibold text-gray-900 sm:text-2xl dark:text-white">정산 관리</h1>
            </div>
            <div class="sm:flex">
                <div class="flex items-center space-x-2 sm:space-x-3 ml-auto">
                    <!-- 총 정산 예정액 표시 -->
                    <div class="mr-4 p-2 bg-gray-100 rounded dark:bg-gray-700">
                        <span class="text-sm text-gray-500 dark:text-gray-400">총 정산 예정액: </span>
                        <span class="text-lg font-bold text-gray-900 dark:text-white" th:text="'₩ ' + ${#numbers.formatInteger(totalSettlementAmount, 0, 'COMMA')}">0원</span>
                    </div>
                    
                    <a href="/admin/settlement/download" class="inline-flex items-center justify-center w-1/2 px-3 py-2 text-sm font-medium text-center text-white rounded-lg bg-green-700 hover:bg-green-800 focus:ring-4 focus:ring-green-300 sm:w-auto dark:bg-green-600 dark:hover:bg-green-700 dark:focus:ring-green-800">
                        <svg class="w-5 h-5 mr-2 -ml-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
                        엑셀 다운로드
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="flex flex-col">
        <div class="overflow-x-auto">
            <div class="inline-block min-w-full align-middle">
                <div class="overflow-hidden shadow">
                    <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-600">
                        <thead class="bg-gray-50 dark:bg-gray-700">
                        <tr>
                            <th scope="col" class="p-4 text-xs font-medium tracking-wider text-left text-gray-500 uppercase dark:text-white">강사명</th>
                            <th scope="col" class="p-4 text-xs font-medium tracking-wider text-left text-gray-500 uppercase dark:text-white">총 판매량</th>
                            <th scope="col" class="p-4 text-xs font-medium tracking-wider text-left text-gray-500 uppercase dark:text-white">총 매출액</th>
                            <th scope="col" class="p-4 text-xs font-medium tracking-wider text-left text-gray-500 uppercase dark:text-white">수수료 (30%)</th>
                            <th scope="col" class="p-4 text-xs font-medium tracking-wider text-left text-gray-500 uppercase dark:text-white">정산 예정액</th>
                            <th scope="col" class="p-4 text-xs font-medium tracking-wider text-left text-gray-500 uppercase dark:text-white">상태</th>
                        </tr>
                        </thead>
                        <tbody class="bg-white dark:bg-gray-800">
                        <!-- 데이터가 없을 때 -->
                        <tr th:if="${rows.empty}">
                            <td colspan="6" class="p-4 text-center text-gray-500 dark:text-gray-400">정산 대상 데이터가 없습니다.</td>
                        </tr>
                        
                        <!-- 데이터 반복 출력 -->
                        <tr th:each="row : ${rows}">
                            <td class="p-4 text-sm font-normal text-gray-900 whitespace-nowrap dark:text-white" th:text="${row.instructorName}">김강사</td>
                            <td class="p-4 text-sm font-normal text-gray-500 whitespace-nowrap dark:text-gray-400" th:text="${#numbers.formatInteger(row.totalSalesCount, 0, 'COMMA') + '건'}">1,250</td>
                            <td class="p-4 text-sm font-normal text-gray-500 whitespace-nowrap dark:text-gray-400" th:text="'₩ ' + ${#numbers.formatInteger(row.totalSalesAmount, 0, 'COMMA')}">10,000</td>
                            <td class="p-4 text-sm font-normal text-red-500 whitespace-nowrap dark:text-red-400" th:text="'- ₩ ' + ${#numbers.formatInteger(row.feeAmount, 0, 'COMMA')}">3,000</td>
                            <td class="p-4 text-sm font-semibold text-blue-600 whitespace-nowrap dark:text-blue-400" th:text="'₩ ' + ${#numbers.formatInteger(row.settlementAmount, 0, 'COMMA')}">7,000</td>
                            <td class="p-4 whitespace-nowrap">
                                <span class="bg-green-100 text-green-800 text-xs font-medium mr-2 px-2.5 py-0.5 rounded-md dark:bg-gray-700 dark:text-green-400 border border-green-100 dark:border-green-500">지급 대기</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
