spring:
  application:
    name: learnflow-api
    # LectureService.java의 @Value 경로 주입 설정
    default-thumbnail: "https://storage.googleapis.com/learnflow-file-storage/thumbnails/lecture-default-Image.jpg"

  datasource:
    # GitHub Actions 환경을 위한 H2 메모리 DB 설정
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

  jwt:
    secret: 'KgAzaD5aDg8Hx6vjcBDpX1XRjvJbeHF61jxOqDEJ2S8='
    access-expiration: 3600000
    refresh-expiration: 604800000

  cloud:
    gcp:
      project-id: learnflow-test-project
      credentials:
        enabled: false  # 테스트 시 자동 인증을 시도하지 않도록 설정
      storage:
        enabled: false  # 테스트 시 자동 스토리지 설정을 활성화하지 않음
        bucket-name: learnflow-test-bucket
        # GcpFileUploadService 코드와의 중복 방지를 위해 접두사 제외 및 오타 수정
        json-key-location: dummy-key.json

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

app:
  cors:
    allowed-origins: http://localhost:3000

slack:
  webhook:
    url: http://localhost:8080/dummy
