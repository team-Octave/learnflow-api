  application:
    name: learnflow-api
    # LectureService.java의 @Value 경로에 맞춤
    default-thumbnail: "https://storage.googleapis.com/learnflow-file-storage/thumbnails/lecture-default-Image.jpg"

  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

  jwt:
    secret: 'KgAzaD5aDg8Hx6vjcBDpX1XRjvJbeHF61jxOqDEJ2S8='
    access-expiration: 3600000
    refresh-expiration: 604800000

  cloud:
    gcp:
      project-id: learnflow-test-project # 프로젝트 ID 명시
      storage:
        bucket-name: learnflow-test-bucket
        # GcpFileUploadService에서 "classpath:"를 직접 붙이므로 파일명만 작성
        json-key-location: dummy-key.json
      credentials:
        location: dummy-key.json

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

app:
  cors:
    allowed-origins: http://localhost:3000

slack:
  webhook:
    url: http://localhost:8080/dummy
