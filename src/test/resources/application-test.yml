spring:
  config:
    activate:
      on-profile: test
  datasource:
    # GitHub Actions 환경에서도 잘 돌아가는 메모리 DB 주소입니다.
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop # 테스트 시작 시 테이블 생성, 종료 시 삭제
    show-sql: true

# 외부 변수(Slack 등)가 비어있어서 발생하는 에러를 방지하기 위한 가짜 값입니다.
slack:
  webhook:
    url: http://localhost:8080/dummy
