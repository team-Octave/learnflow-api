name: LearnFlow API CD

on:
  push:
    branches: [ "develop" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 빌드/테스트를 위한 로컬 설정 파일 복원
      - name: Create Config Files from Secrets
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.APPLICATION_DEV_YML }}" > src/main/resources/application-dev.yml
          echo "${{ secrets.APPLICATION_LOCAL_YML }}" > src/main/resources/application-local.yml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test

      - name: Build with Gradle
        run: ./gradlew clean bootJar -x test

      # 2. JAR 파일 전송 (SCP는 JAR만 보냄)
      - name: Upload to GCP VM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: deployer
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build/libs/*.jar"
          target: "/opt/app"
          strip_components: 2

      # 3. 설정 파일 강제 갱신 및 애플리케이션 재시작
      - name: Restart Application
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: deployer
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/app || { echo "Error: Failed to cd to /opt/app"; exit 1; }

            # [핵심 수정] 서버의 설정 파일을 최신 Secrets 내용으로 강제 덮어쓰기
            sudo rm -f application-dev.yml
            sudo tee application-dev.yml > /dev/null <<EOF
            ${{ secrets.APPLICATION_DEV_YML }}
            EOF
            sudo chown deployer:deployer application-dev.yml

            # [핵심 수정] GCP JSON 키 파일 권한 부여 (Permission denied 방지)
            sudo chmod 644 /opt/app/probable-skill-480215-i2-e03bdc4d0d4d.json

            # [Graceful Shutdown]
            PID=$(sudo lsof -ti:8080 || true)
            if [ -n "$PID" ]; then
              sudo kill -15 $PID || true
              for i in {1..30}; do
                if ! sudo lsof -ti:8080 > /dev/null 2>&1; then break; fi
                sleep 1
              done
              sudo fuser -k 8080/tcp || true
            fi

            # [JAR 교체]
            mkdir -p backup
            if [ -f "app.jar" ]; then
              sudo mv app.jar backup/app.jar.$(date +%Y%m%d%H%M%S)
            fi
            LATEST_JAR=$(find . -maxdepth 1 -name "*.jar" -type f -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
            sudo mv "$LATEST_JAR" app.jar

            # [Run] 실행 옵션 강화
            nohup java -jar -Dspring.profiles.active=dev app.jar > app.log 2>&1 &
            
            #환경 변수 주입
            nohup java -jar \
              -Dspring.profiles.active=dev \
              -DADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }} \
              -DADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }} \
              -Dtoss.api.url=${{ secrets.TOSS_URL }} \
              -Dtoss.client.key=${{ secrets.TOSS_CLIENT_KEY }} \
              -Dtoss.secret.key=${{ secrets.TOSS_SECRET_KEY }} \
              -
              app.jar > app.log 2>&1 &
            
            # [Health Check]
            echo "Waiting for application to start..."
            for i in {1..30}; do
              if curl -f http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo "✅ Application started successfully"
                exit 0
              fi
              echo "Still waiting... ($i/30)"
              sleep 4
            done
            exit 1

      - name: Notify Slack
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: "LearnFlow API 배포 결과"
          SLACK_MESSAGE: "배포 상태: ${{ job.status }}"
