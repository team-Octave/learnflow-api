name: LearnFlow API CD

on:
  push:
    branches: [ "develop" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew clean bootJar

      - name: Upload to GCP VM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: deployer
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build/libs/*.jar"
          target: "/opt/app"
          strip_components: 2

      - name: Restart Application
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: deployer
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /opt/app/backup
            if [ -f "/opt/app/app.jar" ]; then
              mv /opt/app/app.jar /opt/app/backup/app.jar.$(date +%Y%m%d%H%M%S)
            fi

            LATEST_JAR=$(find /opt/app -maxdepth 1 -name "*.jar" -type f -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2-)

            if [ -z "$LATEST_JAR" ]; then
              echo "Error: No JAR file found for deployment"
              exit 1
            fi

            mv "$LATEST_JAR" /opt/app/app.jar

            sudo fuser -k 8080/tcp || true
            
            nohup java -jar /opt/app/app.jar --spring.profiles.active=dev > /opt/app/app.log 2>&1 &
