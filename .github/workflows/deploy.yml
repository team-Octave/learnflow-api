name: LearnFlow API CD

on:
  push:
    branches: [ "develop" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # [추가] GitHub Secrets를 사용하여 .gitignore된 설정 파일들을 생성합니다.
      - name: Create Config Files from Secrets
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.APPLICATION_DEV_YML }}" > src/main/resources/application-dev.yml
          echo "${{ secrets.APPLICATION_LOCAL_YML }}" > src/main/resources/application-local.yml
          echo "Configuration files restored."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test

      - name: Build with Gradle
        run: ./gradlew clean bootJar -x test

      - name: Upload to GCP VM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: deployer
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build/libs/*.jar"
          target: "/opt/app"
          strip_components: 2

      - name: Restart Application (사용자 원본 로직 유지)
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: deployer
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/app || { echo "Error: Failed to cd to /opt/app"; exit 1; } 
            
            PID=$(sudo lsof -ti:8080 || true)
            if [ -n "$PID" ]; then
              sudo kill -15 $PID || true
              for i in {1..30}; do
                if ! sudo lsof -ti:8080 > /dev/null 2>&1; then break; fi
                sleep 1
              done
              if sudo lsof -ti:8080 > /dev/null 2>&1; then sudo fuser -k 8080/tcp || true; fi
            fi

            mkdir -p backup
            if [ -f "app.jar" ]; then
              sudo mv app.jar backup/app.jar.$(date +%Y%m%d%H%M%S)
            fi

            LATEST_JAR=$(find . -maxdepth 1 -name "*.jar" -type f -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
            if [ -z "$LATEST_JAR" ]; then exit 1; fi
            sudo mv "$LATEST_JAR" app.jar

            # 앱 실행 (dev 프로필 적용)
            nohup java -jar app.jar \
              --spring.profiles.active=dev \
              --management.endpoints.web.exposure.include=health,info,prometheus \
              > app.log 2>&1 &

            echo "Waiting for health check..."
            for i in {1..30}; do
              if curl -f http://localhost:8080/actuator/health > /dev/null 2>&1; then exit 0; fi
              sleep 4
            done
            exit 1

      - name: Notify Slack
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: "LearnFlow API 배포 결과"
